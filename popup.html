<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Registro Rápido</title>
  <style>
    :root {
      --bg: #dfe7f1;
      --surface: #f8fafc;
      --surface-2: #ffffff;
      --surface-3: #d6e0eb;
      --border: #b9c7d8;
      --border-strong: #7b8fa7;
      --text: #0f172a;
      --text-muted: #475569;
      --accent: #059669;
      --accent-strong: #047857;
      --accent-soft: #ecfdf5;
      --secondary: #2563eb;
      --secondary-strong: #1d4ed8;
      --danger: #dc2626;
    }
    /* Tema automático (segue o sistema) quando o usuário não forçou um tema */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg: #131c2e;
        --surface: #162237;
        --surface-2: #1c2740;
        --surface-3: #263752;
        --border: #3a4d70;
        --border-strong: #46608a;
        --text: #e6edf6;
        --text-muted: #93a1b5;
        --accent: #10b981;
        --accent-strong: #34d399;
        --accent-soft: #0c2a20;
        --secondary: #3b82f6;
        --secondary-strong: #60a5fa;
        --danger: #f87171;
      }
    }
    /* Tema forçado pelo usuário (salvo na página completa) */
    :root[data-theme="dark"] {
      --bg: #131c2e;
      --surface: #162237;
      --surface-2: #1c2740;
      --surface-3: #263752;
      --border: #3a4d70;
      --border-strong: #46608a;
      --text: #e6edf6;
      --text-muted: #93a1b5;
      --accent: #10b981;
      --accent-strong: #34d399;
      --accent-soft: #0c2a20;
      --secondary: #3b82f6;
      --secondary-strong: #60a5fa;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    input, .time-field select, .chip, .btn-agora, .stat, #popupMsg { box-shadow: 0 6px 18px rgba(30,55,85,.07); }
    .head { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    .head .logo {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      display: grid; place-items: center; font-size: 16px;
    }
    h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-muted);
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 11px;
      font-size: 15px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      box-sizing: border-box;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]::placeholder { color: var(--text-muted); opacity: .8; }
    input[type="text"]:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    /* Atalhos de valor (chips) */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .chip {
      width: auto;
      margin: 0;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip:hover { background: var(--surface-3); }
    .chip.chip-default { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
    /* Campo de hora (HH : MM) */
    .time-field { display: flex; align-items: center; gap: 6px; }
    .time-field select {
      flex: 1;
      padding: 10px 8px;
      font-size: 15px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 9px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .time-field select:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .time-sep { color: var(--text-muted); font-weight: 700; }
    .btn-agora {
      flex: none;
      width: auto;
      margin: 0;
      padding: 9px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
    }
    .btn-agora:hover { background: var(--surface-3); color: var(--text); }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      color: #fff;
      transition: background .15s, transform .05s;
    }
    button:active { transform: translateY(1px); }
    .register-btn { background-color: var(--accent); }
    .register-btn:hover { background-color: var(--accent-strong); }
    .goto-btn { background-color: var(--secondary); }
    .goto-btn:hover { background-color: var(--secondary-strong); }
    #popupStatus {
      margin-top: 12px;
      text-align: center;
      font-weight: 600;
      color: var(--accent-strong);
      min-height: 18px;
      font-size: 13.5px;
    }
    /* Painel de contexto: hoje, 7 dias e tempo desde o último registro */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .stat {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 6px 8px;
      text-align: center;
      min-width: 0;
    }
    .stat .lab {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: 3px;
      white-space: nowrap;
    }
    .stat .val {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .stat .val .u { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-left: 1px; }
    .stat .sub { font-size: 10px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; }
    .stat.acc { border-color: var(--accent); background: var(--accent-soft); }
    .stat.acc .val { color: var(--accent-strong); }
    #popupMsg {
      margin-top: 11px;
      padding: 10px 11px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text);
      text-align: left;
      text-wrap: pretty;
      min-height: 17px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 9px 9px 0;
    }
    #popupMsg::before { content:"Direção agora"; display:block; color:var(--accent-strong); font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:3px; }
  </style>
</head>
<body>
  <div class="head">
    <div class="logo">📉</div>
    <h2>Registro Rápido</h2>
  </div>
  <label for="popupQuantidade">Quantidade</label>
  <!-- autofocus: foca a quantidade ao abrir o popup -->
  <input type="text" id="popupQuantidade" placeholder="Digite a quantidade" autofocus>
  <!-- Atalhos de valor (1 é o padrão; demais são os últimos valores usados) -->
  <div class="chips" id="popupChips"></div>
  <label for="popupHH">Hora (24h)</label>
  <div class="time-field">
    <select id="popupHH" aria-label="Hora"></select>
    <span class="time-sep">:</span>
    <select id="popupMM" aria-label="Minuto"></select>
    <button type="button" id="popupAgoraBtn" class="btn-agora" tabindex="-1" title="Definir hora para agora">Agora</button>
  </div>
  <button class="register-btn" id="popupRegistrarBtn">Registrar</button>
  <button class="goto-btn" id="popupGotoBtn">Ir para a página de registros</button>
  <div id="popupStatus"></div>
  <!-- Contexto do dia sem precisar abrir a página completa -->
  <div class="stats">
    <div class="stat acc">
      <div class="lab">Hoje</div>
      <div class="val" id="stHoje">0<span class="u">g</span></div>
      <div class="sub" id="stHojeSub">0 registros</div>
    </div>
    <div class="stat">
      <div class="lab">7 dias</div>
      <div class="val" id="stSem">0<span class="u">g</span></div>
      <div class="sub" id="stSemSub">0 g/dia</div>
    </div>
    <div class="stat">
      <div class="lab">Último</div>
      <div class="val" id="stGap">—</div>
      <div class="sub" id="stGapSub">atrás</div>
    </div>
  </div>
  <div id="popupMsg"></div>
  <script src="mensagens.js"></script>
  <script src="popup.js"></script>
</body>
</html>
