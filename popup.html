<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registro Rápido</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface-2: #f8fafc;
      --border: #cbd5e1;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #059669;
      --accent-strong: #047857;
      --accent-soft: #ecfdf5;
      --secondary: #2563eb;
      --secondary-strong: #1d4ed8;
      --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131c2e;
        --surface-2: #0f1726;
        --border: #35435e;
        --text: #e6edf6;
        --text-muted: #93a1b5;
        --accent: #10b981;
        --accent-strong: #34d399;
        --accent-soft: #0c2a20;
        --secondary: #3b82f6;
        --secondary-strong: #60a5fa;
        --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    .head { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    .head .logo {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      display: grid; place-items: center; font-size: 16px;
    }
    h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-muted);
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 11px;
      font-size: 15px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      box-sizing: border-box;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]::placeholder { color: var(--text-muted); opacity: .8; }
    input[type="text"]:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      color: #fff;
      transition: background .15s, transform .05s;
    }
    button:active { transform: translateY(1px); }
    .register-btn { background-color: var(--accent); }
    .register-btn:hover { background-color: var(--accent-strong); }
    .goto-btn { background-color: var(--secondary); }
    .goto-btn:hover { background-color: var(--secondary-strong); }
    #popupStatus {
      margin-top: 12px;
      text-align: center;
      font-weight: 600;
      color: var(--accent-strong);
      min-height: 18px;
      font-size: 13.5px;
    }
    #popupResumoHoje {
      margin-top: 12px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-muted);
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="head">
    <div class="logo">📉</div>
    <h2>Registro Rápido</h2>
  </div>
  <label for="popupQuantidade">Quantidade</label>
  <!-- autofocus: foca a quantidade ao abrir o popup -->
  <input type="text" id="popupQuantidade" placeholder="Digite a quantidade" autofocus>
  <label for="popupHora">Hora (HH:MM)</label>
  <input type="text" id="popupHora" placeholder="hh:mm">
  <button class="register-btn" id="popupRegistrarBtn">Registrar</button>
  <button class="goto-btn" id="popupGotoBtn">Ir para a página de registros</button>
  <div id="popupStatus"></div>
  <!-- Contexto do dia sem precisar abrir a página completa -->
  <div id="popupResumoHoje"></div>
  <script src="popup.js"></script>
</body>
</html>
