<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Registro Rápido</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;
      --border: #cbd5e1;
      --border-strong: #cbd5e1;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #059669;
      --accent-strong: #047857;
      --accent-soft: #ecfdf5;
      --secondary: #2563eb;
      --secondary-strong: #1d4ed8;
      --danger: #dc2626;
    }
    /* Tema automático (segue o sistema) quando o usuário não forçou um tema */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg: #1a2439;
        --surface-2: #2c3c5e;
        --surface-3: #3d5178;
        --border: #4b608a;
        --border-strong: #5f77a4;
        --text: #f3f7fd;
        --text-muted: #a8b8ce;
        --accent: #10b981;
        --accent-strong: #45e0a8;
        --accent-soft: #1b4536;
        --secondary: #4f8ff7;
        --secondary-strong: #6ba4fb;
        --danger: #fb8b8b;
      }
    }
    /* Tema forçado pelo usuário (salvo na página completa) */
    :root[data-theme="dark"] {
      --bg: #1a2439;
      --surface-2: #2c3c5e;
      --surface-3: #3d5178;
      --border: #4b608a;
      --border-strong: #5f77a4;
      --text: #f3f7fd;
      --text-muted: #a8b8ce;
      --accent: #10b981;
      --accent-strong: #45e0a8;
      --accent-soft: #1b4536;
      --secondary: #4f8ff7;
      --secondary-strong: #6ba4fb;
      --danger: #fb8b8b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 12px;
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .head { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    .head .logo {
      width: 26px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      display: grid; place-items: center; font-size: 14px;
    }
    h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    label {
      display: block;
      margin-top: 7px;
      margin-bottom: 3px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: var(--text-muted);
    }
    input[type="text"] {
      width: 100%;
      padding: 7px 10px;
      font-size: 14px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      box-sizing: border-box;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]::placeholder { color: var(--text-muted); opacity: .8; }
    input[type="text"]:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    /* Atalhos de valor (chips) */
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .chip {
      width: auto;
      margin: 0;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip:hover { background: var(--surface-3); }
    .chip.chip-default { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
    /* Ferramentas: ícones com rótulo no hover */
    .tools { display: flex; justify-content: center; gap: 7px; margin-top: 7px; }
    .ibtn {
      position: relative;
      width: auto; margin: 0;
      padding: 5px 9px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      color: var(--text-muted);
      display: grid; place-items: center;
      cursor: pointer;
    }
    .ibtn:hover { background: var(--surface-3); color: var(--text); }
    .ibtn svg { width: 14px; height: 14px; display: block; }
    .ibtn::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 6px); left: 50%;
      transform: translateX(-50%);
      background: var(--surface-3); color: var(--text);
      border: 1px solid var(--border-strong); border-radius: 6px;
      padding: 3px 8px; font-size: 11px; font-weight: 600; white-space: nowrap;
      opacity: 0; pointer-events: none; transition: opacity .12s;
    }
    .ibtn:hover::after { opacity: 1; }
    /* Campo de hora (HH : MM) */
    .time-field { display: flex; align-items: center; gap: 6px; }
    .time-field select {
      flex: 1;
      padding: 7px 7px;
      font-size: 14px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .time-field select:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .time-sep { color: var(--text-muted); font-weight: 700; }
    .btn-agora {
      flex: none;
      width: auto;
      margin: 0;
      padding: 7px 9px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
    }
    .btn-agora:hover { background: var(--surface-3); color: var(--text); }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      transition: background .15s, transform .05s;
    }
    button:active { transform: translateY(1px); }
    .register-btn { background-color: var(--accent); }
    .register-btn:hover { background-color: var(--accent-strong); }
    .goto-btn { background-color: var(--secondary); }
    .goto-btn:hover { background-color: var(--secondary-strong); }
    #popupStatus {
      margin-top: 6px;
      text-align: center;
      font-weight: 600;
      color: var(--accent-strong);
      min-height: 14px;
      font-size: 12.5px;
    }
    :root { --warn: #b45309; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme]) { --warn: #fbbf24; } }
    :root[data-theme="dark"] { --warn: #fbbf24; }
    /* Painel de contexto: hoje, 7 dias e tempo desde o último registro */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .stat {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 6px 5px 5px;
      text-align: center;
      min-width: 0;
    }
    .stat .lab {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .stat .val {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .stat .val .u { font-size: 10px; font-weight: 600; color: var(--text-muted); margin-left: 1px; }
    .stat .sub { font-size: 9.5px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; }
    .stat.acc { border-color: var(--accent); background: var(--accent-soft); }
    .stat.acc .val { color: var(--accent-strong); }
    /* Distância até a média diária dos 7 dias anteriores */
    .pace { margin-top: 7px; }
    .pace .ptrack {
      height: 4px;
      border-radius: 999px;
      background: var(--surface-3);
      overflow: hidden;
    }
    .pace .ptrack i { display: block; height: 100%; border-radius: 999px; transition: width .2s ease; }
    .pace .ptxt {
      margin-top: 4px;
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pace .ptxt b { font-weight: 700; }
    #popupMsg {
      margin-top: 7px;
      font-size: 11.5px;
      line-height: 1.35;
      color: var(--text-muted);
      text-align: center;
      text-wrap: pretty;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div class="head">
    <div class="logo">📉</div>
    <h2>Registro Rápido</h2>
  </div>
  <label for="popupQuantidade">Quantidade</label>
  <!-- autofocus: foca a quantidade ao abrir o popup -->
  <input type="text" id="popupQuantidade" placeholder="Digite a quantidade" autofocus>
  <!-- Atalhos de valor (1 é o padrão; demais são os últimos valores usados) -->
  <div class="chips" id="popupChips"></div>
  <label for="popupHH">Hora (24h)</label>
  <div class="time-field">
    <select id="popupHH" aria-label="Hora"></select>
    <span class="time-sep">:</span>
    <select id="popupMM" aria-label="Minuto"></select>
    <button type="button" id="popupAgoraBtn" class="btn-agora" tabindex="-1" title="Definir hora para agora">Agora</button>
  </div>
  <button class="register-btn" id="popupRegistrarBtn">Registrar</button>
  <button class="goto-btn" id="popupGotoBtn">Ir para a página de registros</button>
  <div id="popupStatus"></div>
  <!-- Backup em CSV, sem sair do popup -->
  <div class="tools">
    <button type="button" class="ibtn" id="btnExpCsv" data-tip="Exportar CSV" aria-label="Exportar CSV" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 11 5 5 5-5"></path><path d="M4 20h16"></path></svg>
    </button>
    <button type="button" class="ibtn" id="btnImpCsv" data-tip="Importar CSV" aria-label="Importar CSV" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"></path><path d="m7 13 5-5 5 5"></path><path d="M4 4h16"></path></svg>
    </button>
  </div>
  <!-- Contexto do dia sem precisar abrir a página completa -->
  <div class="stats">
    <div class="stat acc">
      <div class="lab">Hoje</div>
      <div class="val" id="stHoje">0<span class="u">g</span></div>
      <div class="sub" id="stHojeSub">0 registros</div>
    </div>
    <div class="stat">
      <div class="lab">7 dias</div>
      <div class="val" id="stSem">0<span class="u">g</span></div>
      <div class="sub" id="stSemSub">0 g/dia</div>
    </div>
    <div class="stat">
      <div class="lab">Último</div>
      <div class="val" id="stGap">—</div>
      <div class="sub" id="stGapSub">atrás</div>
    </div>
  </div>
  <div class="pace" id="pace" hidden>
    <div class="ptrack"><i id="paceFill"></i></div>
    <div class="ptxt" id="paceTxt"></div>
  </div>
  <div id="popupMsg"></div>
  <script src="mensagens.js"></script>
  <script src="popup.js"></script>
</body>
</html>
